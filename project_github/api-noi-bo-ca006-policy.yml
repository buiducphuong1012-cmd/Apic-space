kind: DataPowerAssembly
apiVersion: api.ibm.com/v1
metadata:
  name: api-noi-bo-ca006-policy
  namespace: project_github
  version: '1.0'
  tags: []
  labels:
    gatewayTypes:
      - datapower
spec:
  x-ibm-configuration:
    gateway: datapower-api-gateway
    assembly:
      execute:
        - invoke:
            version: 2.3.0
            title: invoke
            backend-type: detect
            target-url: https://backend.example.vn/dieuphoiapi
            header-control:
              type: blocklist
              values: []
            parameter-control:
              type: allowlist
              values: []
            http-version: HTTP/1.1
            timeout: 60
            verb: keep
            chunked-uploads: true
            persistent-connection: true
            cache-response: protocol
            cache-ttl: 900
            websocket-upgrade: false
            graphql-send-type: detect
    phase: realized
    enforced: true
    testable: true
    cors:
      enabled: true
